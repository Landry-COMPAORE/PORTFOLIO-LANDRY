<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0f2922"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="ecoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(52, 211, 153, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Sky background with ecological atmosphere -->
  <rect width="1200" height="675" fill="url(#ecoSky)"/>
  <rect width="1200" height="675" fill="url(#ecoGrid)"/>

  <!-- Sun / Clean Energy Aura -->
  <circle cx="950" cy="180" r="140" fill="#34d399" opacity="0.15" filter="blur(30px)"/>
  <circle cx="950" cy="180" r="60" fill="#fef08a" opacity="0.4"/>

  <!-- Low-carbon Modern Residential Buildings with Green Terraces -->
  <!-- Building 1 (Left) -->
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="220" height="360" fill="url(#buildingGrad)" rx="6"/>
    <!-- Timber Louvers / Brise-soleil bois -->
    <rect x="10" y="10" width="200" height="15" fill="url(#woodGrad)"/>
    <rect x="10" y="70" width="200" height="15" fill="url(#woodGrad)"/>
    <rect x="10" y="130" width="200" height="15" fill="url(#woodGrad)"/>
    <rect x="10" y="190" width="200" height="15" fill="url(#woodGrad)"/>
    <rect x="10" y="250" width="200" height="15" fill="url(#woodGrad)"/>
    <!-- Windows & Balconies -->
    <g fill="#10b981" opacity="0.85">
      <!-- Green Balcony planters -->
      <rect x="15" y="30" width="80" height="30" rx="3" fill="#059669"/>
      <rect x="125" y="30" width="80" height="30" rx="3" fill="#059669"/>
      <rect x="15" y="90" width="80" height="30" rx="3" fill="#059669"/>
      <rect x="125" y="90" width="80" height="30" rx="3" fill="#059669"/>
      <rect x="15" y="150" width="80" height="30" rx="3" fill="#059669"/>
      <rect x="125" y="150" width="80" height="30" rx="3" fill="#059669"/>
      <rect x="15" y="210" width="80" height="30" rx="3" fill="#059669"/>
      <rect x="125" y="210" width="80" height="30" rx="3" fill="#059669"/>
    </g>
    <!-- Rooftop Solar Panels -->
    <polygon points="-10,0 230,0 210,-35 10,-35" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Building 2 (Center - Stepped Terraces) -->
  <g transform="translate(420, 120)">
    <polygon points="0,420 320,420 320,80 220,80 220,40 120,40 120,0 0,0" fill="url(#buildingGrad)"/>
    <!-- Green Roof Gardens -->
    <rect x="0" y="-12" width="120" height="12" fill="#10b981" rx="2"/>
    <rect x="120" y="28" width="100" height="12" fill="#10b981" rx="2"/>
    <rect x="220" y="68" width="100" height="12" fill="#10b981" rx="2"/>
    <!-- Glass Facade Ribbons -->
    <g fill="#0284c7" opacity="0.6">
      <rect x="20" y="30" width="80" height="40"/>
      <rect x="20" y="90" width="80" height="40"/>
      <rect x="140" y="90" width="60" height="40"/>
      <rect x="20" y="150" width="80" height="40"/>
      <rect x="140" y="150" width="60" height="40"/>
      <rect x="240" y="150" width="60" height="40"/>
      <rect x="20" y="220" width="280" height="30"/>
      <rect x="20" y="270" width="280" height="30"/>
      <rect x="20" y="320" width="280" height="30"/>
    </g>
  </g>

  <!-- Building 3 (Right) -->
  <g transform="translate(790, 200)">
    <rect x="0" y="0" width="240" height="340" fill="url(#buildingGrad)" rx="6"/>
    <rect x="10" y="-15" width="220" height="15" fill="#059669" rx="3"/>
    <!-- Windows Grid -->
    <g fill="#38bdf8" opacity="0.4">
      <rect x="30" y="40" width="45" height="45"/>
      <rect x="95" y="40" width="45" height="45"/>
      <rect x="160" y="40" width="45" height="45"/>
      <rect x="30" y="110" width="45" height="45"/>
      <rect x="95" y="110" width="45" height="45"/>
      <rect x="160" y="110" width="45" height="45"/>
      <rect x="30" y="180" width="45" height="45"/>
      <rect x="95" y="180" width="45" height="45"/>
      <rect x="160" y="180" width="45" height="45"/>
    </g>
  </g>

  <!-- Sustainable Hydrological Basin (Noue paysagère / Bassin de rétention d'eau pluviale) -->
  <path d="M 0 540 Q 300 500 600 530 T 1200 520 L 1200 675 L 0 675 Z" fill="#042f2e"/>
  <!-- Wetland / Water Surface -->
  <path d="M 120 580 Q 450 540 750 570 T 1150 560 Q 950 630 650 620 T 120 580 Z" fill="url(#waterGrad)" opacity="0.85"/>
  <ellipse cx="650" cy="590" rx="280" ry="25" fill="#38bdf8" opacity="0.3" filter="blur(6px)"/>

  <!-- Pedestrian Boardwalk & Trees -->
  <path d="M 80 560 L 1180 550" stroke="#f59e0b" stroke-width="6" stroke-dasharray="12,6"/>
  <!-- Vegetation -->
  <circle cx="110" cy="530" r="28" fill="#10b981"/>
  <circle cx="380" cy="510" r="22" fill="#059669"/>
  <circle cx="760" cy="520" r="30" fill="#34d399"/>
  <circle cx="1120" cy="510" r="25" fill="#10b981"/>

  <!-- Technical Overlay Badge -->
  <g transform="translate(40, 40)">
    <rect width="320" height="75" rx="8" fill="#064e3b" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="30" fill="#ecfdf5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="16">ÉCO-QUARTIER BAS CARBONE</text>
    <text x="20" y="55" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12">48 M€ • BASSINS & BÉTON RECYCLÉ</text>
  </g>
</svg>
