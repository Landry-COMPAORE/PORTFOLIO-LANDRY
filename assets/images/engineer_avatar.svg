<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="#38bdf8" stroke-width="4"/>

  <!-- Blueprint Grid Rings -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="6,6"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>

  <!-- Silhouette Body / High-Vis Jacket -->
  <path d="M 90 390 C 90 300, 140 270, 200 270 C 260 270, 310 300, 310 390 Z" fill="url(#jacketGrad)"/>
  <!-- Safety Vest Reflective Stripes -->
  <path d="M 140 280 L 120 390" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <path d="M 260 280 L 280 390" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <rect x="150" y="320" width="100" height="12" fill="#f8fafc" rx="2"/>

  <!-- Neck & Face Profile -->
  <rect x="175" y="210" width="50" height="60" rx="8" fill="#d97706" opacity="0.8"/>
  <ellipse cx="200" cy="190" rx="45" ry="50" fill="#fcd34d"/>

  <!-- Safety Helmet (Casque de chantier d'ingénieur) -->
  <path d="M 140 170 Q 200 100 260 170 L 275 178 Q 200 170 125 178 Z" fill="url(#helmetGrad)"/>
  <path d="M 120 175 C 150 175, 250 175, 280 175 C 285 175, 290 180, 280 183 C 250 188, 150 188, 120 183 C 110 180, 115 175, 120 175 Z" fill="#b45309"/>
  <!-- Helmet Crest -->
  <path d="M 194 110 Q 200 95 206 110 L 204 165 L 196 165 Z" fill="#fef08a" opacity="0.8"/>

  <!-- Technical compass / Ruler accent -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#0b1320" stroke="#f59e0b" stroke-width="2"/>
    <text x="14" y="26" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="16">GC</text>
  </g>
</svg>
